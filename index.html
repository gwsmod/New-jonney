<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BHAU Admin Settings</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#080b12;color:#eef2ff}.wrap{max-width:760px;margin:auto;padding:20px}.head{padding:20px;border-radius:22px;background:linear-gradient(135deg,#17102b,#0d1626);border:1px solid #302354;margin-bottom:16px}.card{background:#101725;border:1px solid #273149;border-radius:20px;padding:18px;margin:14px 0}h1,h2{margin:0 0 10px}h2{font-size:17px}.row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #20293a;gap:12px}.row:last-child{border:0}.switch{width:52px;height:30px;position:relative;display:inline-block}.switch input{display:none}.slider{position:absolute;inset:0;background:#3b4252;border-radius:99px;cursor:pointer}.slider:before{content:'';position:absolute;width:22px;height:22px;left:4px;top:4px;background:white;border-radius:50%;transition:.2s}.switch input:checked+.slider{background:#16a34a}.switch input:checked+.slider:before{transform:translateX(22px)}.modes{display:flex;gap:10px}.mode{flex:1;padding:14px;border:1px solid #34405a;border-radius:14px;cursor:pointer;text-align:center}.mode.active{border-color:#7c3aed;background:#241341}input[type=number],input[type=text]{width:100%;padding:12px;border-radius:12px;border:1px solid #34405a;background:#080d17;color:white;margin-top:7px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{width:100%;padding:15px;border:0;border-radius:14px;background:#7c3aed;color:#fff;font-weight:800;font-size:15px;cursor:pointer}.btn.secondary{background:#263146}.status{font-size:13px;color:#94a3b8;margin-top:10px}.hidden{display:none}@media(max-width:500px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body><div class="wrap">
<div class="head"><h1>⚙️ BHAU Admin Panel</h1><div>Firebase live settings control</div><div id="status" class="status">Connecting…</div></div>
<div class="card"><h2>📋 Menu Control</h2><div id="menus"></div></div>
<div class="card"><h2>💸 Withdrawal Settings</h2>
<div class="modes"><div class="mode" data-mode="fixed">Fixed Amount</div><div class="mode" data-mode="any">Any Amount</div></div>
<div id="fixedBox"><label>Allowed amounts (comma separated)</label><input id="fixedAmounts" type="text" value="200,300,500,1000,2000,5000"></div>
<div id="anyBox" class="hidden"><div class="grid"><div><label>Minimum</label><input id="minimum" type="number" value="1"></div><div><label>Maximum</label><input id="maximum" type="number" value="999999"></div></div></div>
</div>
<button id="saveBtn" class="btn">💾 SAVE SETTINGS</button>
<button id="reloadBtn" class="btn secondary" style="margin-top:10px">↻ Reload from Firebase</button>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
import { getDatabase, ref, get, set } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";
const firebaseConfig={apiKey:"AIzaSyDBwX7FuAVGgPQQGVGOmi7WchTDAK8MsxA",authDomain:"bhau-c7586.firebaseapp.com",databaseURL:"https://bhau-c7586-default-rtdb.firebaseio.com",projectId:"bhau-c7586",storageBucket:"bhau-c7586.firebasestorage.app",messagingSenderId:"1097089579562",appId:"1:1097089579562:web:df5de026482a38540fa153"};
const app=initializeApp(firebaseConfig),db=getDatabase(app),path=ref(db,'dashboardSettings');
const menuLabels={games:'Games',limbo:'Limbo',deposit:'Deposit',withdraw:'Withdrawal',addcard:'Add Card',autoclaim:'Auto Claim',balance:'Balance',transactions:'Transactions',refer:'Referral',smartcalc:'Smart Calculator'};
const defaults={menus:Object.fromEntries(Object.keys(menuLabels).map(k=>[k,true])),withdrawal:{mode:'any',fixedAmounts:[200,300,500,1000,2000,5000],minimum:1,maximum:999999}};
let state=structuredClone(defaults);
const menus=document.getElementById('menus');
for(const [key,label] of Object.entries(menuLabels)){menus.insertAdjacentHTML('beforeend',`<div class="row"><span>${label}</span><label class="switch"><input type="checkbox" data-menu="${key}" checked><span class="slider"></span></label></div>`)}
function render(){document.querySelectorAll('[data-menu]').forEach(x=>x.checked=state.menus[x.dataset.menu]!==false);document.querySelectorAll('.mode').forEach(x=>x.classList.toggle('active',x.dataset.mode===state.withdrawal.mode));fixedAmounts.value=(state.withdrawal.fixedAmounts||[]).join(',');minimum.value=state.withdrawal.minimum;maximum.value=state.withdrawal.maximum;fixedBox.classList.toggle('hidden',state.withdrawal.mode!=='fixed');anyBox.classList.toggle('hidden',state.withdrawal.mode!=='any')}
document.querySelectorAll('.mode').forEach(x=>x.onclick=()=>{state.withdrawal.mode=x.dataset.mode;render()});
async function load(){status.textContent='Loading settings…';const snap=await get(path);const d=snap.val();state={menus:{...defaults.menus,...(d?.menus||{})},withdrawal:{...defaults.withdrawal,...(d?.withdrawal||{})}};render();status.textContent='● Connected to Firebase';}
saveBtn.onclick=async()=>{state.menus={};document.querySelectorAll('[data-menu]').forEach(x=>state.menus[x.dataset.menu]=x.checked);const amounts=fixedAmounts.value.split(',').map(x=>Number(x.trim())).filter(x=>Number.isFinite(x)&&x>0);state.withdrawal.fixedAmounts=[...new Set(amounts)];state.withdrawal.minimum=Number(minimum.value)||1;state.withdrawal.maximum=Number(maximum.value)||999999;if(state.withdrawal.maximum<state.withdrawal.minimum){alert('Maximum must be greater than minimum.');return}await set(path,state);status.textContent='✓ Settings saved and synced';};
reloadBtn.onclick=load;load().catch(e=>status.textContent='Connection error: '+e.message);
</script></body></html>
